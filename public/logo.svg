<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- Premium gold gradient definition -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6F4E" />
      <stop offset="30%" stop-color="#B8956A" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6F4E" />
    </linearGradient>
  </defs>
  
  <!-- Modern Minimalist MECHTY Group Logomark & Typography -->
  <g transform="translate(10, 10)">
    <!-- Geometric M-shaped luxury crest / emblem on the left -->
    <path d="M 10 90 L 10 10 L 40 50 L 70 10 L 70 90 M 15 85 L 15 25 L 40 58 L 65 25 L 65 85" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Subtle gold accent square in center -->
    <rect x="36" y="70" width="8" height="8" fill="url(#goldGradient)" />
    
    <!-- MECHTY display typography -->
    <text x="100" y="62" 
          font-family="'Cormorant Garamond', 'Times New Roman', serif" 
          font-size="44" 
          font-weight="300" 
          letter-spacing="0.3em" 
          fill="#F5F1EA">MECHTY</text>
          
    <!-- GROUP secondary branding -->
    <text x="105" y="86" 
          font-family="'Manrope', 'Arial', sans-serif" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="0.6em" 
          fill="#8B8478">GROUP</text>
  </g>
</svg>
